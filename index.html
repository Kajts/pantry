<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f5f6">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Spiżarnia</title>
<style>
:root{--bg:#f8f5f6;--card:#fff;--tx:#2d2a32;--mut:#8a8591;--ac:#4f7564;--on:#fff;--soft:#edf3ef;--hi:#f6dde1;--hiT:#8a3b4f;--ln:#e9e3e6;--bad:#b5546a;--sh:0 1px 2px rgba(60,40,55,.05),0 6px 18px rgba(60,40,55,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#1a1719;--card:#242023;--tx:#f0ecee;--mut:#a39da6;--ac:#9cc9b4;--on:#17211c;--soft:#2b3631;--hi:#4a3239;--hiT:#f3c4cf;--ln:#352f33;--bad:#f0a0b3;--sh:0 1px 2px rgba(0,0,0,.3)}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Nunito",system-ui,-apple-system,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom))}
main{max-width:620px;margin:0 auto;padding:18px 16px}
h2{font-size:1.65rem;font-weight:700;margin:4px 0 14px;letter-spacing:-.01em}
.row{display:flex;gap:8px;align-items:center}
input,textarea,button{font:inherit;color:inherit}
input,textarea{width:100%;padding:12px 16px;border:1.5px solid var(--ln);border-radius:16px;background:var(--card)}
input::placeholder,textarea::placeholder{color:var(--mut)}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
textarea{min-height:80px;resize:vertical;margin-top:10px}
button{border:0;border-radius:999px;padding:11px 20px;background:var(--ac);color:var(--on);font-weight:700;cursor:pointer}
button.g{background:var(--soft);color:var(--ac)}
button.s{padding:7px 14px;min-width:36px;font-size:.92rem}
.it{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:14px 16px;margin-top:12px}
.it .t{display:flex;gap:10px;align-items:center;justify-content:space-between}
.n{font-weight:700}.m{color:var(--mut);font-size:.9rem;margin-top:2px}
.q{min-width:64px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.ok{color:var(--ac)}.no{color:var(--bad)}
.tag{display:inline-block;font-size:.8rem;padding:3px 12px;border-radius:99px;background:var(--hi);color:var(--hiT);font-weight:700}
.always{background:linear-gradient(0deg,var(--card),var(--card)) padding-box}
.done .n{text-decoration:line-through;color:var(--mut)}
input[type=checkbox]{accent-color:var(--ac);width:22px;height:22px;padding:0;border-radius:8px}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:596px;margin:0 auto;display:flex;gap:4px;padding:6px;background:var(--card);border-radius:24px;box-shadow:0 8px 28px rgba(60,40,55,.16)}
nav button{flex:1;background:transparent;color:var(--mut);padding:11px 2px;font-size:.88rem}
nav button.on{background:var(--hi);color:var(--hiT)}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.empty{color:var(--mut);padding:22px 6px;text-align:center}
#qr{background:#fff;padding:14px;display:inline-block;border-radius:18px}
ul{padding-left:20px;margin:8px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;font-weight:700;z-index:9}#toast.show{opacity:1}
.ing-row{display:flex;gap:8px;margin-top:8px}.ing-row .pn{flex:3;min-width:0}.ing-row .pa{flex:2;min-width:0}.ing-row button{padding:8px 14px}
@media(prefers-reduced-motion:no-preference){button{transition:transform .1s}button:active{transform:scale(.97)}}
</style>
</head>
<body>
<main id="v"></main>
<nav id="nav">
  <button data-t="pantry">Spiżarnia</button>
  <button data-t="rec">Przepisy</button>
  <button data-t="shop">Zakupy</button>
  <button data-t="set">Ustawienia</button>
</nav>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// ====== KONFIGURACJA: wklej tu dane z Firebase (patrz instrukcja). Bez tego dane są tylko na tym telefonie. ======
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA6lxC6xnzpwEZF9X1jfmUAQhtFvwWyDLk",
  authDomain: "pantry-home-db5d5.firebaseapp.com",
  projectId: "pantry-home-db5d5",
  storageBucket: "pantry-home-db5d5.firebasestorage.app",
  messagingSenderId: "573643950047",
  appId: "1:573643950047:web:7df7b74773a6e10732a66a"
};
/* przykład:
const FIREBASE_CONFIG = {apiKey:"...",authDomain:"...",projectId:"...",appId:"..."};
*/

// ====== Rozumienie słów: mleko / mleka / mleku => to samo ======
const SYN={jaj:'jajk',jajek:'jajk',cukr:'cukier',maslo:'masl',ziemniak:'kartofl',kartofl:'kartofl'};
function stem(w){
  if(w.length>3){for(const e of ['ami','ach','iem','ow','om','em','ie','y','i','a','e','o','u']){
    if(w.endsWith(e)&&w.length-e.length>=3){w=w.slice(0,-e.length);break}}}
  return SYN[w]||w;
}
function key(s){
  return s.toLowerCase().replace(/ł/g,'l').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean).map(stem).join(' ');
}
// "mleko 2", "2 mleka", "mąka 500 g", "jajka" => {name,qty,unit}
function parse(t){
  t=t.trim();let qty=1,unit='';
  const m=t.match(/(^|\s)(\d+(?:[.,]\d+)?)\s*(kg|g|l|ml|szt|litr\w*|kilo\w*|gram\w*|opak\w*|łyżk\w*|łyżecz\w*|szklan\w*|szczypt\w*|ząb\w*|plast\w*|garś\w*|puszk\w*)?(?=\s|$)/i);
  if(m){qty=parseFloat(m[2].replace(',','.'));unit=(m[3]||'').toLowerCase().replace(/^litr.*/,'l').replace(/^kilo.*/,'kg').replace(/^gram.*/,'g');t=(t.slice(0,m.index)+' '+t.slice(m.index+m[0].length)).trim()}
  return {name:t.replace(/\s+/g,' ')||'?',qty,unit};
}

// ====== Stan i synchronizacja ======
const $=s=>document.querySelector(s), uid=()=>Math.random().toString(36).slice(2,9);
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(q,u)=>(+(+q).toFixed(2))+(u?' '+u:'');
const LS={get(k){try{return localStorage.getItem(k)}catch(_){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(_){}}};
let S={pantry:[],recipes:[],shop:[]},tab='pantry',editR=null,draft=null,noteId=null,delId=null,ref=null,sync='lokalnie (bez Firebase)';
let code=location.hash.slice(1)||LS.get('sp_code')||uid()+uid()+uid();
LS.set('sp_code',code);try{history.replaceState(null,'','#'+code)}catch(_){}
try{S=Object.assign(S,JSON.parse(LS.get('sp_'+code)||'{}'))}catch(_){}

function save(){
  LS.set('sp_'+code,JSON.stringify(S));
  if(ref)ref.set(S).catch(err=>{sync='błąd: '+err.message;render()});
  render();
}
if(FIREBASE_CONFIG&&window.firebase){
  firebase.initializeApp(FIREBASE_CONFIG);
  ref=firebase.firestore().collection('households').doc(code);
  ref.onSnapshot(d=>{
    sync='zsynchronizowano ✓';
    if(!d.exists){ref.set(S);return}
    if(d.metadata.hasPendingWrites)return;
    S=Object.assign({pantry:[],recipes:[],shop:[]},d.data());
    LS.set('sp_'+code,JSON.stringify(S));
    if(!/INPUT|TEXTAREA/.test(document.activeElement.tagName))render();
  },err=>{sync='błąd: '+err.message;render()});
}

// ====== Logika ======
const same=(a,b)=>a.key===b.key&&(a.unit===b.unit||!a.unit||!b.unit);
function addTo(list,o){
  o.key=key(o.name);
  const f=S[list].find(x=>same(x,o));
  if(f){f.qty+=o.qty;if(!f.unit)f.unit=o.unit}
  else S[list].push({id:uid(),name:o.name,key:o.key,qty:o.qty,unit:o.unit,note:'',always:false,done:false});
}
const toBase=(q,u)=>u==='kg'?[q*1000,'g']:u==='l'?[q*1000,'ml']:[q,u];
const nu=u=>{u=toBase(0,u)[1];return u==='szt'?'':u};
const compat=(a,b)=>a.key===b.key&&nu(a.unit)===nu(b.unit);
// Porównuje ilości tylko gdy jednostki są zgodne (g z g, ml z ml, sztuki ze sztukami).
// Gdy się nie da (np. w spiżarni "mleko 1", w przepisie "mleko 200 g"), liczy się sam fakt, że produkt jest.
const have=ing=>{
  const p=S.pantry.filter(x=>x.key===ing.key&&(x.qty>0||x.always));
  if(p.some(x=>x.always))return Infinity;
  const f=/^(kg|l)$/.test(ing.unit)?1000:1;let sum=0;
  for(const x of p){if(nu(x.unit)===nu(ing.unit))sum+=toBase(x.qty,x.unit)[0];else return Infinity}
  return sum/f;
};
const short=i=>i.qty>0?have(i)<i.qty:have(i)<=0;
const missing=r=>r.ing.filter(short);

// ====== Import przepisu z wklejonego tekstu ======
function importText(t){
  t=t.replace(/½/g,'0,5').replace(/¼/g,'0,25').replace(/\b1\/2\b/g,'0,5').replace(/\b1\/4\b/g,'0,25').replace(/(^|\s)pół(?=\s)/gi,'$10,5');
  const L=t.split('\n').map(x=>x.replace(/^[\s\-–•*☐□▢]+/,'').replace(/\(.*?\)/g,'').trim()).filter(Boolean);
  const iI=L.findIndex(x=>/^sk[łl]adniki/i.test(x)),iS=L.findIndex(x=>/^(przygotowanie|spos[oó]b|kroki|wykonanie|instrukcj)/i.test(x));
  const title=(iI!==0&&iS!==0)?L[0]:'';
  const ing=iI>=0?L.slice(iI+1,iS>iI?iS:undefined):[];
  const steps=iS>=0?L.slice(iS+1):(iI>=0?[]:L.slice(1));
  return {name:title,desc:'',steps:steps.join('\n'),ingText:ing.join('\n'),ing:[]};
}

const A={
  padd(){$('#q').value.split(/[,\n;]+/).filter(x=>x.trim()).forEach(x=>addTo('pantry',parse(x)));save()},
  sadd(){$('#q').value.split(/[,\n;]+/).filter(x=>x.trim()).forEach(x=>addTo('shop',parse(x)));save()},
  inc(l,i,d){d=+d;const x=S[l].find(y=>y.id===i);const st=/^(g|ml)$/.test(x.unit)?100:1;x.qty=Math.max(0,x.qty+d*st);save()},
  del(l,i){S[l]=S[l].filter(y=>y.id!==i);save()},
  note(l,i){noteId=i;render();setTimeout(()=>{const f=$('#nt');if(f){f.focus();f.select()}},0)},
  notesave(i){const x=S.pantry.find(y=>y.id===i);if(x)x.note=$('#nt').value.trim();noteId=null;save()},
  notecancel(){noteId=null;render()},
  always(i){const x=S.pantry.find(y=>y.id===i);x.always=!x.always;save()},
  chk(i){const x=S.shop.find(y=>y.id===i);x.done=!x.done;save()},
  bought(){S.shop.filter(x=>x.done).forEach(x=>addTo('pantry',{name:x.name,qty:x.qty,unit:x.unit}));S.shop=S.shop.filter(x=>!x.done);save()},
  rsave(){
    const name=$('#rn').value.trim();if(!name)return toast('Podaj nazwę przepisu');
    const r={id:editR&&editR!=='new'?editR:uid(),name,desc:$('#rd').value.trim(),steps:$('#rs').value.trim(),
      ing:[...document.querySelectorAll('.ing-row')].map(r=>({n:r.querySelector('.pn').value.trim(),a:r.querySelector('.pa').value.trim()})).filter(x=>x.n).map(x=>{let qty=0,unit='';if(/\d/.test(x.a)){const o=parse('x '+x.a);qty=o.qty;unit=o.unit}return {name:x.n,qty,unit,key:key(x.n)}})};
    S.recipes=S.recipes.filter(x=>x.id!==r.id).concat(r);editR=null;draft=null;save();
  },
  rnew(){draft=null;editR='new';render()},redit(i){draft=null;editR=i;render()},rcancel(){draft=null;editR=null;render()},
  rimp(){editR='import';render()},
  ing(){$('#ings').insertAdjacentHTML('beforeend',ingRow('',''))},
  rimport(){const t=$('#ri2').value;if(!t.trim())return;draft=importText(t);editR='new';render()},
  rdel(i){if(delId!==i){delId=i;render();setTimeout(()=>{if(delId===i){delId=null;render()}},4000);return}delId=null;S.recipes=S.recipes.filter(x=>x.id!==i);save()},
  rshop(i){missing(S.recipes.find(x=>x.id===i)).forEach(g=>addTo('shop',{name:g.name,unit:g.unit,qty:g.qty>0?g.qty-have(g):1}));save();tab='shop';render()},
  rcook(i){
    S.recipes.find(x=>x.id===i).ing.forEach(g=>{
      if(!(g.qty>0))return;let left=toBase(g.qty,g.unit)[0];S.pantry.filter(x=>compat(x,g)&&!x.always).forEach(x=>{const f=/^(kg|l)$/.test(x.unit)?1000:1;const t=Math.min(x.qty*f,left);x.qty=+((x.qty*f-t)/f).toFixed(3);left-=t});
    });
    S.pantry=S.pantry.filter(x=>x.qty>0||x.always);save();
  },
  copy(){navigator.clipboard.writeText(location.href).then(()=>toast('Skopiowano link'),()=>toast('Nie udało się skopiować'))}
};
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a;if(a==='ingx'){b.closest('.ing-row').remove();return}if(a==='tab'){tab=b.dataset.t;editR=null;render();return}
  A[a](...(b.dataset.p?b.dataset.p.split('|'):[]));
});
$('#nav').addEventListener('click',ev=>{const b=ev.target.closest('button');if(b){tab=b.dataset.t;editR=null;render()}});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='nt')A.notesave(noteId);if(ev.key==='Enter'&&ev.target.id==='q')(tab==='shop'?A.sadd:A.padd)()});
function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.textContent=m;t.className='show';clearTimeout(toast.h);toast.h=setTimeout(()=>{t.className=''},2600)}
const P=(...a)=>`data-p="${a.join('|')}"`;

const ingRow=(n,a)=>`<div class="ing-row"><input class="pn" list="dl" placeholder="produkt, np. makaron penne" value="${e(n)}" autocomplete="off"><input class="pa" placeholder="ile, np. 200 g" value="${e(a)}" autocomplete="off"><button class="g" data-a="ingx" aria-label="Usuń składnik">×</button></div>`;
function rowsFrom(r){
  const rows=r.ingText!==undefined?r.ingText.split('\n').filter(x=>x.trim()).map(l=>{if(!/\d/.test(l))return [l.trim(),''];const o=parse(l);return [o.name,fmt(o.qty,o.unit)]}):r.ing.map(i=>[i.name,i.qty>0?fmt(i.qty,i.unit):'']);
  while(rows.length<3)rows.push(['','']);return rows;
}
// ====== Widoki ======
const quick=(act,ph)=>`<div class="row"><input id="q" placeholder="${ph}" autocomplete="off"><button data-a="${act}">Dodaj</button></div>`;
const V={
pantry(){
  const L=[...S.pantry].sort((a,b)=>a.name.localeCompare(b.name,'pl'));
  return `<h2>Spiżarnia</h2>${quick('padd','mleko 2, jajka 10, mąka 1 kg')}
  ${L.map(x=>`<div class="it ${x.always?'always':''}"><div class="t"><div><div class="n">${e(x.name)}</div>
    ${x.note?`<div class="m">${e(x.note)}</div>`:''}</div>
    <div class="row">${x.always?'<span class="tag">zawsze mam</span>':`<button class="g s" data-a="inc" ${P('pantry',x.id,-1)}>−</button><span class="q">${fmt(x.qty,x.unit)}</span><button class="g s" data-a="inc" ${P('pantry',x.id,1)}>+</button>`}</div></div>
    ${noteId===x.id?`<div class="row" style="margin-top:10px"><input id="nt" value="${e(x.note)}" placeholder="np. dolna półka, marka, otwarte 20.10" autocomplete="off"><button class="s" data-a="notesave" data-p="${x.id}">Zapisz</button><button class="g s" data-a="notecancel">×</button></div>`:''}<div class="row" style="margin-top:8px;justify-content:flex-end">
    <button class="g s" data-a="note" ${P('pantry',x.id)}>Opis</button>
    <button class="g s" data-a="always" ${P(x.id)}>${x.always?'Policz':'Zawsze mam'}</button>
    <button class="g s" data-a="del" ${P('pantry',x.id)}>Usuń</button></div></div>`).join('')||'<p class="empty">Pusto. Wpisz powyżej, co masz w domu, rozdzielając przecinkami.</p>'}`;
},
rec(){
  if(editR==='import')return `<h2>Importuj przepis</h2><p class="m">Skopiuj tekst przepisu ze strony (tytuł, składniki, sposób przygotowania) i wklej tutaj. Aplikacja rozpozna sekcje, a przed zapisem możesz wszystko poprawić.</p>
    <textarea id="ri2" style="min-height:240px" placeholder="Wklej tutaj tekst przepisu"></textarea>
    <div class="row" style="margin-top:10px"><button data-a="rimport">Rozpoznaj</button><button class="g" data-a="rcancel">Anuluj</button></div>`;
  if(editR){
    const r=editR==='new'?(draft||{name:'',desc:'',steps:'',ing:[]}):S.recipes.find(x=>x.id===editR);
    return `<h2>${editR==='new'?'Nowy przepis':'Edytuj przepis'}</h2>
    <input id="rn" placeholder="Nazwa" value="${e(r.name)}">
    <textarea id="rd" placeholder="Opis (np. ulubione naleśniki niedzielne)">${e(r.desc)}</textarea>
    <div class="m" style="margin-top:14px">Składniki (ilość możesz zostawić pustą)</div>
    <div id="ings">${rowsFrom(r).map(x=>ingRow(x[0],x[1])).join('')}</div>
    <datalist id="dl">${[...new Set(S.pantry.map(x=>x.name))].map(n=>`<option value="${e(n)}">`).join('')}</datalist>
    <button class="g s" data-a="ing" style="margin-top:10px">+ składnik</button>
    <textarea id="rs" placeholder="Kroki przygotowania" style="min-height:130px">${e(r.steps)}</textarea>
    <div class="row" style="margin-top:10px"><button data-a="rsave">Zapisz</button><button class="g" data-a="rcancel">Anuluj</button></div>`;
  }
  return `<h2>Przepisy</h2><div class="row"><button data-a="rnew">+ Nowy przepis</button><button class="g" data-a="rimp">Importuj</button></div><div class="m" style="margin-top:6px">Od najłatwiejszych do ugotowania</div>
  ${[...S.recipes].map(r=>({r,mi:missing(r)})).sort((a,b)=>a.mi.length-b.mi.length||a.r.name.localeCompare(b.r.name,'pl')).map(({r,mi})=>{return `<details class="it"><summary><div class="t"><span class="n">${e(r.name)}</span>
    ${mi.length===0?'<span class="m ok">masz wszystko ✓</span>':mi.length===1?`<span class="m no">brakuje tylko: ${e(mi[0].name)}</span>`:`<span class="m no">brakuje ${mi.length}</span>`}</div>
    ${r.desc?`<div class="m">${e(r.desc)}</div>`:''}</summary>
    <ul>${r.ing.map(i=>`<li class="${short(i)?'no':'ok'}">${e(i.name)}${i.qty>0?' '+fmt(i.qty,i.unit):''}</li>`).join('')}</ul>
    <div style="white-space:pre-wrap">${e(r.steps)}</div>
    <div class="row" style="margin-top:10px;flex-wrap:wrap">
    ${mi.length?`<button class="s" data-a="rshop" ${P(r.id)}>Braki → zakupy</button>`:''}
    <button class="s" data-a="rcook" ${P(r.id)}>Ugotowane (odejmij)</button>
    <button class="g s" data-a="redit" ${P(r.id)}>Edytuj</button><button class="g s" data-a="rdel" ${P(r.id)}>${delId===r.id?'Na pewno?':'Usuń'}</button></div></details>`}).join('')||'<p class="empty">Dodaj pierwszy przepis, który często gotujecie.</p>'}`;
},
shop(){
  const n=S.shop.filter(x=>x.done).length;
  return `<h2>Zakupy</h2>${quick('sadd','masło, 2 cebule, ser 300 g')}
  ${S.shop.map(x=>`<div class="it ${x.done?'done':''}"><div class="t"><label class="row" style="flex:1"><input type="checkbox" style="width:22px;height:22px" ${x.done?'checked':''} data-a="chk" ${P(x.id)}><span class="n">${e(x.name)}</span><span class="m">${fmt(x.qty,x.unit)}</span></label>
  <button class="g s" data-a="del" ${P('shop',x.id)}>Usuń</button></div></div>`).join('')||'<p class="empty">Lista pusta. Dodaj rzeczy lub użyj „Braki → zakupy” w przepisie.</p>'}
  ${n?`<div style="margin-top:14px"><button data-a="bought">Kupione (${n}) → do spiżarni</button></div>`:''}`;
},
set(){
  return `<h2>Ustawienia</h2><div class="it"><div class="n">Synchronizacja</div><div class="m">${e(sync)}</div></div>
  <div class="it"><div class="n">Kod do drzwi spiżarki</div><div class="m">Ten kod QR otwiera aplikację z waszymi wspólnymi danymi. Wydrukuj i przyklej.</div>
  <p><span id="qr"></span></p><button class="g s" data-a="copy">Kopiuj link</button></div>`;
}};

function render(){
  $('#v').innerHTML=V[tab]();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  if(tab==='set'&&window.QRCode)new QRCode($('#qr'),{text:location.href,width:200,height:200});
}
render();
</script>
</body>
</html>
